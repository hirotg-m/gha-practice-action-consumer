name: Environment variables
on: push
env:
  ENV1: value1
  ENV2: value2
jobs:
  job1:
    runs-on: ubuntu-latest
    env:
      ENV2: value2a
    steps:
      - name: s1
        run: |
          echo "ENV1 - ${ENV1}"
          echo "ENV2 - ${ENV2}"
      - name: s2
        env:
          ENV2: value2b
          ENV3: value3
        run: |
          echo "ENV1 - ${ENV1}"
          echo "ENV2 - ${ENV2}"
          echo "ENV3 - ${ENV3}"