name: Contexts
on: push
jobs:
  job1:
    runs-on: ubuntu-latest
    steps:
      - name: Print github context
        run: |
          echo "run_id is ${{ github.run_id }}"
          echo "head_ref is ${{ github.head_ref }}"
          echo "workspace is ${{ github.workspace }}"
          echo "repository is ${{ github.repository }}"
          echo "repository_owner is ${{ github.repository_owner }}"
          echo "event is ${{ github.event_name }}"
      - name: Print runner context
        run: |
          echo "runner.os is ${{ runner.os }}"
          echo "runner.arch is ${{ runner.arch }}"
          echo "runner.name is ${{ runner.name }}"
          echo "runner.temp is ${{ runner.temp }}"
          echo "runner.tool_cache is ${{ runner.tool_cache }}"
